<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 Sorpresa</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #111827, #312e81);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px;
      text-align: center;
      border-radius: 24px;
      background: rgba(255,255,255,.10);
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .emoji {
      font-size: 65px;
    }

    h1 {
      margin: 10px 0;
    }

    p {
      color: #ddd;
      line-height: 1.5;
    }

    button, a {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 22px;
      border: 0;
      border-radius: 12px;
      background: #8b5cf6;
      color: white;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover, a:hover {
      background: #7c3aed;
    }

    .info {
      display: none;
      margin-top: 25px;
      padding: 18px;
      border-radius: 15px;
      background: rgba(0,0,0,.25);
    }

    .ip {
      font-size: 22px;
      font-weight: bold;
      color: #a78bfa;
      word-break: break-all;
    }

    #error {
      color: #fca5a5;
      margin-top: 15px;
    }

    .map {
      background: #10b981;
    }

    .map:hover {
      background: #059669;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="emoji">🎁</div>

  <h1>¡Hay una sorpresa para vos!</h1>

  <p>
    Tocá el botón para continuar.
  </p>

  <button onclick="comenzar()">
    Continuar →
  </button>

  <div id="info" class="info">

    <h2>😂 ¡CAÍSTE!</h2>

    <p>La IP pública detectada es:</p>

    <div id="ip" class="ip">
      Cargando...
    </div>

    <div id="ubicacion"></div>

    <div id="mapaContainer"></div>

  </div>

  <div id="error"></div>

</div>

<script>

async function obtenerIP() {

  try {

    const respuesta =
      await fetch("https://api.ipify.org?format=json");

    const datos = await respuesta.json();

    document.getElementById("ip").textContent =
      datos.ip;

  } catch (error) {

    document.getElementById("ip").textContent =
      "No disponible";

  }
}


function obtenerUbicacion() {

  const ubicacion =
    document.getElementById("ubicacion");

  if (!navigator.geolocation) {

    ubicacion.innerHTML =
      "<p>Tu navegador no permite obtener la ubicación.</p>";

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(posicion) {

      const lat =
        posicion.coords.latitude;

      const lon =
        posicion.coords.longitude;

      ubicacion.innerHTML = `
        <p>
          📍 Ubicación autorizada
        </p>

        <p>
          Latitud: <b>${lat.toFixed(6)}</b><br>
          Longitud: <b>${lon.toFixed(6)}</b>
        </p>
      `;

      document.getElementById("mapaContainer").innerHTML = `
        <a
          class="map"
          target="_blank"
          href="https://www.google.com/maps?q=${lat},${lon}">
          🗺️ Abrir ubicación
        </a>
      `;

    },

    function(error) {

      if (error.code === 1) {

        ubicacion.innerHTML =
          "<p>📍 No se autorizó la ubicación.</p>";

      } else {

        ubicacion.innerHTML =
          "<p>📍 No se pudo obtener la ubicación.</p>";

      }

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );
}


function comenzar() {

  document.querySelector("button").style.display =
    "none";

  document.getElementById("info").style.display =
    "block";

  obtenerIP();

  obtenerUbicacion();

}

</script>

</body>
</html>
