<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 Sorpresa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #4c1d95);
      color: white;
      text-align: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      border-radius: 25px;
      padding: 35px 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #ddd;
      line-height: 1.5;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px 25px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #8b5cf6;
      color: white;
      margin-top: 15px;
    }

    button:hover {
      background: #7c3aed;
    }

    #resultado {
      margin-top: 25px;
      display: none;
    }

    .coords {
      background: rgba(0,0,0,.25);
      border-radius: 15px;
      padding: 15px;
      margin: 15px 0;
      word-break: break-all;
    }

    a {
      display: inline-block;
      margin-top: 10px;
      color: white;
      background: #10b981;
      padding: 12px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    #error {
      color: #fca5a5;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div style="font-size:60px;">🎁</div>

    <h1>¡Encontraste la sorpresa!</h1>

    <p>
      Para continuar, podés compartir tu ubicación con esta página.
      El navegador te pedirá permiso antes de hacerlo.
    </p>

    <button onclick="obtenerUbicacion()">
      📍 Compartir mi ubicación
    </button>

    <div id="resultado">
      <h2>😂 ¡CAÍSTE!</h2>

      <p>Esta es la ubicación que autorizaste a compartir:</p>

      <div class="coords">
        <strong>Latitud:</strong>
        <span id="latitud"></span>
        <br><br>
        <strong>Longitud:</strong>
        <span id="longitud"></span>
      </div>

      <a id="mapa" target="_blank">
        🗺️ Abrir en Google Maps
      </a>
    </div>

    <div id="error"></div>

  </div>

  <script>
    function obtenerUbicacion() {

      const error = document.getElementById("error");
      const resultado = document.getElementById("resultado");

      error.textContent = "";

      if (!navigator.geolocation) {
        error.textContent =
          "Tu navegador no permite obtener la ubicación.";
        return;
      }

      navigator.geolocation.getCurrentPosition(

        function(posicion) {

          const lat = posicion.coords.latitude;
          const lon = posicion.coords.longitude;

          document.getElementById("latitud").textContent =
            lat.toFixed(6);

          document.getElementById("longitud").textContent =
            lon.toFixed(6);

          document.getElementById("mapa").href =
            `https://www.google.com/maps?q=${lat},${lon}`;

          resultado.style.display = "block";
        },

        function(error) {

          if (error.code === 1) {
            error.textContent =
              "No se concedió permiso para compartir la ubicación.";
          } else if (error.code === 2) {
            error.textContent =
              "No se pudo determinar la ubicación.";
          } else {
            error.textContent =
              "Se produjo un error al obtener la ubicación.";
          }

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );
    }
  </script>

</body>
</html>
